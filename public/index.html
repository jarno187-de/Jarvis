<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#08090c;--fog:#ece9f3;--dim:rgba(236,233,243,.46);--faint:rgba(236,233,243,.14);--ice:#9fe8ff;--violet:#a78bfa;--peach:#ffb38a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;height:100%;background:var(--ink);color:var(--fog);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}#app{height:100%;display:flex;flex-direction:column;padding:22px clamp(18px,4vw,48px) 22px;background:radial-gradient(120% 70% at 50% 38%,#10121a 0%,var(--ink) 62%)}header{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.04em;color:var(--dim);opacity:0;animation:fade 1.4s .9s forwards}.brand{display:flex;align-items:center;gap:10px;color:var(--fog);font-weight:400}.dot{width:6px;height:6px;border-radius:50%;background:var(--ice);box-shadow:0 0 12px var(--ice);transition:background .6s,box-shadow .6s}body[data-s=listening] .dot{background:var(--peach);box-shadow:0 0 14px var(--peach)}body[data-s=thinking] .dot{background:var(--violet);box-shadow:0 0 14px var(--violet);animation:blink 1s infinite}body[data-s=speaking] .dot{background:var(--fog);box-shadow:0 0 14px var(--fog)}#status{margin-left:2px;color:var(--dim);font-weight:300}#clock{font-variant-numeric:tabular-nums}#stage{flex:1;min-height:0;position:relative}#orb{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;opacity:0;transform:scale(.6);animation:orbIn 2.2s cubic-bezier(.16,1,.3,1) .1s forwards}#text{text-align:center;max-width:680px;margin:0 auto;min-height:150px;padding:0 4px;overflow:auto}#you{font-size:14px;color:var(--dim);min-height:20px;margin-bottom:10px;transition:opacity .5s}#reply{font-size:clamp(20px,3.2vw,28px);line-height:1.35;font-weight:200;letter-spacing:-.005em}.w{display:inline-block;white-space:pre;opacity:0;filter:blur(8px);transform:translateY(6px);animation:word .7s cubic-bezier(.2,.7,.2,1) forwards}#composer{margin:18px auto 0;width:100%;max-width:560px;display:flex;align-items:center;gap:6px;border:1px solid var(--faint);border-radius:999px;padding:6px 6px 6px 22px;background:rgba(255,255,255,.025);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .4s,box-shadow .4s;opacity:0;animation:fade 1.2s 1.3s forwards}#composer:focus-within{border-color:rgba(167,139,250,.55);box-shadow:0 0 40px -10px rgba(167,139,250,.5)}#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fog);font:inherit;font-size:16px;padding:10px 0}#q::placeholder{color:var(--dim)}button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:background .3s,color .3s,transform .3s}button:hover{background:rgba(255,255,255,.07);color:var(--fog)}button:active{transform:scale(.92)}button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#mic.on{background:var(--peach);color:var(--ink);animation:ping 1.6s infinite}#send{background:var(--fog);color:var(--ink)}#send:hover{background:#fff;color:var(--ink)}#snd.off{opacity:.35}@keyframes fade{to{opacity:1}}@keyframes orbIn{to{opacity:1;transform:scale(1)}}@keyframes word{to{opacity:1;filter:blur(0);transform:none}}@keyframes blink{50%{opacity:.35}}@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,179,138,.5)}100%{box-shadow:0 0 0 16px rgba(255,179,138,0)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
/* Kleine Bedienelemente im Stil der vorhandenen Oberfläche */
.actions{display:flex;align-items:center;gap:4px}.actions button{width:36px;height:36px}.badge{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--peach)}#notices{position:absolute;z-index:3;top:55px;right:clamp(18px,4vw,48px);width:min(360px,calc(100vw - 36px));display:grid;gap:8px}.notice{border:1px solid var(--faint);border-radius:14px;background:#151720;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 14px 40px #0008}.notice button{width:auto;height:auto;display:inline-block;color:var(--ice);margin:8px 12px 0 0;font-size:13px}.overlay{position:fixed;inset:0;background:#05060bd9;backdrop-filter:blur(14px);z-index:10;display:grid;place-items:center;padding:18px}.overlay[hidden]{display:none}.panel{width:min(580px,100%);max-height:min(780px,90vh);overflow:auto;border:1px solid var(--faint);border-radius:24px;background:#11131b;padding:28px;box-shadow:0 30px 100px #0009}.panel h1{font-size:25px;font-weight:300;margin:0 0 22px}.panel h2{font-size:16px;font-weight:400;margin:28px 0 12px}.panel p{color:var(--dim);font-size:14px;line-height:1.5}.panel label{display:block;color:var(--dim);font-size:13px;margin:12px 0 6px}.panel input,.panel textarea{width:100%;border:1px solid var(--faint);border-radius:12px;background:#1a1c26;color:var(--fog);font:inherit;padding:11px 13px;outline:none}.panel input:focus,.panel textarea:focus{border-color:var(--violet)}.panel textarea{min-height:90px;resize:vertical}.panel input[type=checkbox]{width:auto;margin-right:8px}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.pill{width:auto;height:auto;border:1px solid var(--faint);border-radius:999px;padding:10px 15px;color:var(--fog);font-size:14px}.pill.primary{background:var(--fog);color:var(--ink)}.item{border:1px solid var(--faint);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px}.item small{color:var(--dim)}.item button{float:right;width:auto;height:auto;color:var(--peach);font-size:13px}.muted{color:var(--dim)}#settings-error,#login-error{color:var(--peach);font-size:13px;min-height:18px}
</style>
</head>
<body data-s="idle">
<div id="app">
<header><div class="brand"><span class="dot"></span>Jarvis<span id="status">Bereit</span></div><div class="actions"><button id="continuous" title="Gesprächsmodus an/aus" aria-label="Gesprächsmodus"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"/></svg></button><button id="settings-open" title="Einstellungen" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><div id="clock"></div></div></header>
<div id="notices"></div><div id="stage"><canvas id="orb" aria-label="Jarvis"></canvas></div>
<div id="text" aria-live="polite"><div id="you"></div><div id="reply"></div></div>
<div id="composer"><input id="q" type="text" autocomplete="off" placeholder="Schreib etwas oder tippe auf den Orb" aria-label="Nachricht"><button id="snd" title="Sprachausgabe an/aus" aria-label="Sprachausgabe"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></button><button id="mic" title="Sprechen" aria-label="Spracheingabe"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button id="send" title="Senden" aria-label="Senden"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
</div>
<div class="overlay" id="login"><div class="panel"><h1>Willkommen bei Jarvis</h1><p>Melde dich mit deinem Server-Passwort an.</p><form id="login-form"><label for="password">Passwort</label><input id="password" type="password" required autocomplete="current-password"><p id="login-error"></p><button class="pill primary" type="submit">Anmelden</button></form></div></div>
<div class="overlay" id="settings" hidden><div class="panel"><div class="row" style="justify-content:space-between"><h1>Einstellungen</h1><button id="settings-close" aria-label="Schließen">✕</button></div><p id="settings-error"></p><h2>Daily Briefing</h2><label><input id="brief-enabled" type="checkbox">Aktiv</label><div class="row"><div style="flex:1"><label for="brief-time">Uhrzeit</label><input id="brief-time" type="time"></div><div style="flex:2"><label for="brief-zone">Zeitzone</label><input id="brief-zone" placeholder="Europe/Berlin"></div></div><label for="brief-topics">Themen, mit Komma getrennt</label><input id="brief-topics" placeholder="Wetter, Nachrichten, Spiele"><p>Für aktuelle Live-Daten braucht Jarvis eine passende Datenquelle. Ohne diese erfindet er keine aktuellen Ergebnisse.</p><button id="brief-save" class="pill primary">Briefing speichern</button><h2>Spezialisierte Agenten</h2><div id="agent-list"></div><label for="agent-name">Name</label><input id="agent-name" maxlength="80" placeholder="Social Media"><label for="agent-description">Beschreibung und Aufgabe</label><textarea id="agent-description" maxlength="2000" placeholder="Du planst und formulierst Social-Media-Beiträge ..."></textarea><button id="agent-add" class="pill">Agent erstellen</button><h2>Tägliche Routinen</h2><div id="routine-list"></div><label for="routine-title">Titel</label><input id="routine-title" placeholder="Morgenplanung"><div class="row"><div style="flex:1"><label for="routine-time">Uhrzeit</label><input id="routine-time" type="time" value="09:00"></div><div style="flex:2"><label for="routine-zone">Zeitzone</label><input id="routine-zone" value="Europe/Berlin"></div></div><label for="routine-message">Aufgabe</label><input id="routine-message" placeholder="Erstelle morgens meine Tagesplanung."><button id="routine-add" class="pill">Routine erstellen</button><h2>Konto</h2><button id="logout" class="pill">Abmelden</button></div></div>
<script src="/app.js"></script>
</body>
</html>
